<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portable JSON-LD File Builder — Enhanced</title>
    <script src="https://cdn.jsdelivr.net/npm/jsonld@3/dist/jsonld.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2/dist/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/multiformats@12.1.3/bundle.min.js"></script>
    <script type="module" src="ld-viewer.js"></script>
</head>
<body>
<ld-viewer>
    <script type="application/ld+json">
{
    "@context": {
        "name": "http://schema.org/name",
        "description": "http://schema.org/description",
        "image": {
            "@id": "http://schema.org/image",
            "@type": "@id"
        },
        "author": "http://schema.org/author",
        "datePublished": {
            "@id": "http://schema.org/datePublished",
            "@type": "http://www.w3.org/2001/XMLSchema#date"
        }
    },
    "name": "Portable JSON-LD File Builder — Enhanced",
    "description": "A web application to create and download JSON-LD files with enhanced features.",
    "image": "https://example.com/image.png",
    "author": "Your Name",
    "datePublished": "2024-06-01"
}
    </script>
</ld-viewer>
</body>
</html>
